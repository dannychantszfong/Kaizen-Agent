# tinyproxy - default-deny egress for the Kaizen lineage.
#
# Only hosts matching /etc/tinyproxy/filter are reachable, and only CONNECT to
# 443 is permitted, so the agent can talk to the provider API and nothing else.
# To allow a different/extra provider endpoint, edit `filter` (the single, small,
# auditable allowlist) - never widen this file.

User nobody
Group nobody
Port 8888

# Listen on all interfaces INSIDE the container. Network-level isolation is the
# real client ACL: only the agent container shares this proxy's internal network,
# and that network has no internet route of its own.
Listen 0.0.0.0
Allow 0.0.0.0/0

Timeout 600
MaxClients 50

# --- the allowlist -----------------------------------------------------------
# FilterDefaultDeny Yes => a host is reachable ONLY if it matches `filter`.
# The filter is applied to the CONNECT target host as well, so HTTPS is gated.
Filter "/etc/tinyproxy/filter"
FilterDefaultDeny Yes
FilterExtended On
FilterCaseSensitive Off

# Only allow tunnelling to TLS. No 80, no arbitrary ports.
ConnectPort 443

# Keep the proxy quiet and forensic-friendly; no disk writes needed.
LogLevel Info
